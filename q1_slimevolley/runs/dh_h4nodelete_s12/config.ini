#--- NEAT configuration for slime volleyball ---#
# 12 observation + 2 relative inputs, 3 binary outputs (the action is MultiBinary(3)).
# Hypothesis H4 arm: relative.ini with conn_delete 0.2 -> 0.05, node_delete 0.1 -> 0.05 (keep the tracking connection).
# Variant "relative": gentle + 2 derived inputs (ball x - my x, ball y - my y),
# see episode.net_inputs. Built on "gentle": node = sigmoid(5*(bias + response*sum)); response 0.2 gives
# the weighted inputs a standard (not 5x-steep) sigmoid
# (outputs were ~83% pinned at 0/1); deletion probs below add probs, since a
# full_direct start leaves add-connection nothing to add (36 -> 5 conns drift).

[NEAT]
fitness_criterion     = max
fitness_threshold     = 5.0
no_fitness_termination = True
pop_size              = 64
reset_on_extinction   = True

[DefaultGenome]
# node activation
activation_default      = sigmoid
activation_mutate_rate  = 0.0
activation_options      = sigmoid

# node aggregation
aggregation_default     = sum
aggregation_mutate_rate = 0.0
aggregation_options     = sum

# node bias
bias_init_mean          = 0.0
bias_init_stdev         = 1.0
bias_max_value          = 30.0
bias_min_value          = -30.0
bias_mutate_power       = 0.5
bias_mutate_rate        = 0.7
bias_replace_rate       = 0.1

# genome compatibility
compatibility_disjoint_coefficient = 1.0
compatibility_weight_coefficient   = 0.5

# connection add/remove rates
conn_add_prob           = 0.5
conn_delete_prob        = 0.05

# connection enable options
enabled_default         = True
enabled_mutate_rate     = 0.01

feed_forward            = True
initial_connection      = full_direct

# node add/remove rates
node_add_prob           = 0.2
node_delete_prob        = 0.05

# network parameters
num_hidden              = 0
num_inputs              = 14
num_outputs             = 3

# node response
response_init_mean      = 0.2
response_init_stdev     = 0.0
response_max_value      = 30.0
response_min_value      = -30.0
response_mutate_power   = 0.0
response_mutate_rate    = 0.0
response_replace_rate   = 0.0

# connection weight
weight_init_mean        = 0.0
weight_init_stdev       = 1.0
weight_max_value        = 30.0
weight_min_value        = -30.0
weight_mutate_power     = 0.5
weight_mutate_rate      = 0.8
weight_replace_rate     = 0.1

[DefaultSpeciesSet]
compatibility_threshold = 2.0

[DefaultStagnation]
species_fitness_func = max
max_stagnation       = 20
species_elitism      = 2

[DefaultReproduction]
elitism            = 2
survival_threshold = 0.2
